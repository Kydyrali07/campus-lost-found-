<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Format Comparison – A2</title>
  <style>
    body { margin: 0; background: #f4f6fa; font-family: system-ui, sans-serif; padding: 24px; }
    h1 { font-size: 18px; margin-bottom: 16px; color: #0f172a; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; text-align: center; }
    .card img { width: 100%; height: 200px; object-fit: cover; image-rendering: pixelated; display: block; }
    .label { padding: 10px 8px; }
    .label .format { font-weight: 700; font-size: 14px; color: #0f172a; }
    .label .size   { font-size: 12px; color: #64748b; margin-top: 4px; }
    .label .quality { font-size: 12px; margin-top: 2px; }
    .sharp   { color: #15803d; font-weight: 600; }
    .accept  { color: #b45309; font-weight: 600; }
  </style>
</head>
<body>
  <h1>A2 – Format Comparison: menu_photo (360 × 360 px, same source image)</h1>
  <div class="grid">
    <div class="card">
      <img src="assets/menu_photo.png" alt="PNG lossless">
      <div class="label">
        <div class="format">PNG (lossless)</div>
        <div class="size">107.8 KB</div>
        <div class="quality sharp">Sharp</div>
      </div>
    </div>
    <div class="card">
      <img src="assets/menu_photo_q80.jpg" alt="JPEG quality 80">
      <div class="label">
        <div class="format">JPEG quality 80</div>
        <div class="size">8.1 KB</div>
        <div class="quality sharp">Sharp</div>
      </div>
    </div>
    <div class="card">
      <img src="assets/menu_photo_q40.jpg" alt="JPEG quality 40">
      <div class="label">
        <div class="format">JPEG quality 40</div>
        <div class="size">4.7 KB</div>
        <div class="quality accept">Acceptable (artefacts)</div>
      </div>
    </div>
    <div class="card">
      <img src="assets/menu_photo.webp" alt="WebP quality 80">
      <div class="label">
        <div class="format">WebP quality 80</div>
        <div class="size">5.0 KB</div>
        <div class="quality sharp">Sharp</div>
      </div>
    </div>
  </div>
</body>
</html>
