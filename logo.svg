<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Campus Lost and Found logo">
  <title>Campus Lost &amp; Found</title>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="#2563eb"/>
  <!-- Magnifying glass handle -->
  <line x1="76" y1="76" x2="92" y2="92" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Magnifying glass circle -->
  <circle cx="54" cy="54" r="26" fill="none" stroke="#ffffff" stroke-width="7"/>
  <!-- Question mark inside -->
  <text x="54" y="63" font-family="system-ui, Arial, sans-serif" font-size="28" font-weight="700"
        text-anchor="middle" fill="#ffffff">?</text>
</svg>
